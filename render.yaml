services:
  - type: web
    name: nutritrack-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: nutrition_tracker
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: nutritrack-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist/client/browser
    routes:
      - type: rewrite
        source: /api/*
        destination: https://nutritrack-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
