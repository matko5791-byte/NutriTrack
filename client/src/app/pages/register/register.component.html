<div class="row justify-content-center mt-4">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h3 mb-4 text-center">Register</h1>

        <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input id="username" type="text" class="form-control" formControlName="username">
            <div class="form-text text-danger" *ngIf="form.get('username')?.touched && form.get('username')?.invalid">
              Username must be at least 3 characters long.
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input id="email" type="email" class="form-control" formControlName="email">
            <div class="form-text text-danger" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
              Please enter a valid email address.
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input id="password" type="password" class="form-control" formControlName="password">
            <div class="form-text text-danger" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
              Password must be at least 6 characters long.
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" type="password" class="form-control" formControlName="confirmPassword">
            <div class="form-text text-danger" *ngIf="form.get('confirmPassword')?.touched && form.errors?.['passwordMismatch']">
              Passwords do not match.
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100" [disabled]="isSubmitting">
            {{ isSubmitting ? 'Creating account...' : 'Create account' }}
          </button>
        </form>

        <p class="mt-3 mb-0 text-center">
          Already have an account? <a routerLink="/login">Log in</a>
        </p>
      </div>
    </div>
  </div>
</div>
